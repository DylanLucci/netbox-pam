[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-pam"
version = "0.1.0"
authors = [
  { name="Dylan Lucci", email="dylan@sol1.com.au" },
]
description = "Privileged Access Management in NetBox"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["netbox", "netbox-pam"]

[project.urls]
"Homepage" = "https://github.com/DylanLucci/netbox-pam/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["netbox_pam*"]

[tool.ruff.lint]
extend-select = ["E4", "E7", "E9", "F", "W", "C"]
ignore = ["F403", "F405"]

[tool.ruff.format]
quote-style = "single"

[tool.isort]
profile = "black"
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "NETBOX",
    "FIRSTPARTY",
    "LOCALFOLDER",
]
known_first_party = ["netbox_pam"]
known_netbox = [
    "netbox",
    "core",
    "dcim",
    "extras",
    "tenancy",
    "users",
    "utilities",
]